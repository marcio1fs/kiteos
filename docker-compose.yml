services:
  db:
    image: postgres:17
    container_name: kiteos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiteos
      POSTGRES_PASSWORD: kiteos
      POSTGRES_DB: kiteos_dev
    ports:
      # Change the host port if 5432 is already taken locally.
      - '5432:5432'
    volumes:
      - kiteos_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiteos -d kiteos_dev']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kiteos_pgdata:
